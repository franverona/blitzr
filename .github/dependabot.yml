version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    groups:
      # Never auto-merged. Next's minors change APIs and defaults; kysely is 0.x, so its minors
      # (0.29 -> 0.30) can break, and it backs the whole data layer.
      framework:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', 'kysely']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom', 'kysely']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
