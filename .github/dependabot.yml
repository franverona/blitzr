version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    ignore:
      # Matches the Node major in .nvmrc and engines: newer types would let code use APIs that
      # throw on the Node we run. Bump all three together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Never auto-merged (dependabot-automerge.yml repeats this list for ungrouped security
      # updates). Next's minors change APIs and defaults; kysely is 0.x, so its minors
      # (0.29 -> 0.30) can break, and it backs the whole data layer.
      framework:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', 'kysely']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom', 'kysely']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      # fetch-metadata runs with the auto-merge workflow's write token, so its bumps come on their
      # own branch, which that workflow skips (see dependabot-automerge.yml): reviewed by hand.
      actions:
        update-types: [minor, patch]
        exclude-patterns: ['dependabot/fetch-metadata']
    commit-message:
      prefix: chore
      include: scope
