version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    groups:
      # Pinned and upgraded by hand: Next's minors change APIs and defaults. Never auto-merged.
      framework:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['next', 'eslint-config-next', 'react', 'react-dom']
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
