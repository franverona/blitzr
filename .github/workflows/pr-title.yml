name: PR title

# Squash merges use the PR title as the commit message, so lint it like one.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Just commitlint and its config, at package.json's versions, instead of the whole project.
      - name: Install commitlint
        run: |
          mkdir "$RUNNER_TEMP/commitlint"
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/"
          cli=$(node -p "require('./package.json').devDependencies['@commitlint/cli']")
          conventional=$(node -p "require('./package.json').devDependencies['@commitlint/config-conventional']")
          cd "$RUNNER_TEMP/commitlint"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@commitlint/cli@$cli" "@commitlint/config-conventional@$conventional"

      - name: Lint the title
        working-directory: ${{ runner.temp }}/commitlint
        run: echo "$TITLE" | npx --no-install commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}
