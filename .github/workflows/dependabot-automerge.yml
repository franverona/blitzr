name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # A pull_request run uses the PR's own workflow file, so a fetch-metadata bump would run its
    # new code with this write token before anyone reviewed it. Its branch is skipped instead.
    if: github.actor == 'dependabot[bot]' && !contains(github.head_ref, 'dependabot/fetch-metadata')
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # Pinned to a commit: this is the only workflow with a write token. Dependabot bumps it.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # The framework group (see dependabot.yml) is left for a manual review. A security update
      # comes ungrouped, so its packages are checked against that group's list too.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.dependency-group != 'framework' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: |
          for dep in ${DEPENDENCY_NAMES//,/ }; do
            case "$dep" in
              next | eslint-config-next | react | react-dom | kysely)
                echo "$dep is left for a manual review"
                exit 0
                ;;
            esac
          done
          gh pr merge --auto --squash "$PR_URL"
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
