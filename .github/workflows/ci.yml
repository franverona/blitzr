name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly on main too, so a new advisory (pnpm audit) shows up before it fails an unrelated PR.
  schedule:
    - cron: '0 6 * * 1'

# A new push to a PR replaces its run, but every merge to main gets its own group and full run:
# back-to-back merges would otherwise cancel each other (even a queued run is cancelled when a
# third joins the group), and they're never tested together before merging.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Production dependencies only: dev tooling (eslint, vitest…) never ships and often has
      # advisories with no fix yet, which would block unrelated PRs.
      - run: pnpm audit --prod

      - run: pnpm format:check

      - run: pnpm exec tsc --noEmit

      - run: pnpm lint

      - run: pnpm test

      - uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm build

      # Catches runtime crashes the build misses, against an empty database. Pages stream through
      # loading.tsx, so one that throws still answers 200, and error.tsx only renders in the browser:
      # the server log is what shows the error.
      - name: Smoke test
        run: |
          log="$RUNNER_TEMP/server.log"
          # A failed check exits before the ⨯ grep below, so print the log there too: it holds the error.
          trap '[ $? -eq 0 ] || { echo "::group::server log"; cat "$log"; echo "::endgroup::"; }' EXIT
          # Without either username every page is the setup screen. Lichess, since it fetches no avatar
          # (and every seeded game is a Lichess one, so no page under test calls api.chess.com).
          LICHESS_USERNAME=smoke pnpm start -p 9878 > "$log" 2>&1 &
          curl -fsS -o /dev/null --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:9878/
          routes='/ /games /openings /learn /settings /repertoire /repertoire?mode=quiz /drill /blunders /puzzles /puzzles/1'
          # Run against the empty database here, and again once the seeded data is in.
          get_routes() {
            for route in $routes; do
              curl -fsS --max-time 30 -o /dev/null "http://127.0.0.1:9878$route" || { echo "::error::$route failed"; exit 1; }
            done
          }
          get_routes
          # One game, inserted after the app created the schema, for a real /games/[id].
          node <<'JS'
          const db = new (require('better-sqlite3'))('data/blitzr.db')
          db.prepare(`INSERT INTO games (id, url, pgn, moves_san, initial_fen, time_control,
            time_class, rules, rated, end_time, white_username, white_result, black_username,
            black_result, my_color, my_result, archive_ym, created_at, site)
            VALUES ('smoke', '', @pgn, @moves, @fen, '180', 'blitz', 'chess', 0, 1, 'smoke-white',
            'win', 'smoke-black', 'checkmated', 'white', 'win', 'manual', '', 'lichess')`).run({
            // A clock on every ply, so /blunders' "By time left" renders.
            pgn: '1. e4 {[%clk 0:03:00]} 1... e5 {[%clk 0:03:00]} 2. Bc4 {[%clk 0:02:50]} 2... Nc6 {[%clk 0:02:55]} 3. Qh5 {[%clk 0:00:30]} 3... Nf6 {[%clk 0:02:50]} 4. Qxf7# {[%clk 0:00:25]} 1-0',
            moves: JSON.stringify(['e4', 'e5', 'Bc4', 'Nc6', 'Qh5', 'Nf6', 'Qxf7#']),
            fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
          })
          // A synced Lichess game: its id has a ":", which reaches the page percent-encoded.
          // Older than "smoke", so Today's last game stays that one.
          db.prepare(`INSERT INTO games (id, url, pgn, moves_san, initial_fen, time_control,
            time_class, rules, rated, end_time, white_username, white_result, black_username,
            black_result, my_color, my_result, archive_ym, created_at, site)
            VALUES ('lichess:smoke123', 'https://lichess.org/smoke123', @pgn, @moves, @fen, '180+0',
            'blitz', 'chess', 0, 0, 'smoke-lichess', 'win', 'smoke-black', 'checkmated', 'white',
            'win', 'lichess:1970-01', '', 'lichess')`).run({
            pgn: '1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0',
            moves: JSON.stringify(['e4', 'e5', 'Bc4', 'Nc6', 'Qh5', 'Nf6', 'Qxf7#']),
            fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
          })
          // An analysis with an own blunder (2.Bc4, Nf3 was best) and the opponent's (3...Nf6,
          // punished by Qxf7#), so the blunder, punish, drill and trouble-card paths all render.
          const e = (cp, mate, from, to, san) => ({ cp, mate, bestMove: from ? { from, to, san, bestLine: [] } : null })
          db.prepare(`INSERT INTO game_analysis (game_id, evals, analyzed_at, movetime_ms)
            VALUES ('smoke', ?, '1970-01-01T00:00:01.000Z', 150)`).run(JSON.stringify([
            e(30, null, 'e2', 'e4', 'e4'), e(30, null, 'e7', 'e5', 'e5'), e(30, null, 'g1', 'f3', 'Nf3'),
            e(-300, null, 'g8', 'f6', 'Nf6'), e(-300, null, 'g1', 'f3', 'Nf3'), e(-300, null, 'g7', 'g6', 'g6'),
            e(null, 1, 'h5', 'f7', 'Qxf7#'), e(null, 1),
          ]))
          // Missed three times, so it's a trouble card; the deck sync keeps it as the blunder's card.
          db.prepare(`INSERT INTO drill_cards (game_id, source_type, ply, due_at, interval_days,
            ease_factor, repetitions, last_reviewed_at, created_at)
            VALUES ('smoke', 'blunder', 3, '1970-01-02T00:00:00.000Z', 1, 1.9, 0,
            '1970-01-01T00:00:01.000Z', '1970-01-01T00:00:01.000Z')`).run()
          // A practice game played from it: listed only on its source and under ?practice=1.
          db.prepare(`INSERT INTO games (id, url, pgn, moves_san, initial_fen, time_control,
            time_class, rules, rated, end_time, white_username, white_result, black_username,
            black_result, my_color, my_result, archive_ym, created_at, source_game_id, source_ply,
            site)
            VALUES ('smoke-practice', '', '', @moves, @fen, '', 'practice', 'chess', 0, 2,
            'smoke-white', 'win', 'Stockfish 1600', 'checkmated', 'white', 'win', 'practice', '',
            'smoke', 4, 'lichess')`).run({
            moves: JSON.stringify(['Qh5', 'Nf6', 'Qxf7#']),
            fen: 'r1bqkbnr/pppp1ppp/2n5/4p3/2B1P3/8/PPPP1PPP/RNBQK1NR w KQkq - 2 3',
          })
          // A thrown win: the same moves as Black, winning after 1...e5 and mated in the end. It's
          // rated, so its play page picks the bot level nearest Black's 1790.
          db.prepare(`INSERT INTO games (id, url, pgn, moves_san, initial_fen, time_control,
            time_class, rules, rated, end_time, white_username, white_rating, white_result,
            black_username, black_rating, black_result, my_color, my_result, archive_ym, created_at,
            site)
            VALUES ('smoke-thrown', '', @pgn, @moves, @fen, '180', 'blitz', 'chess', 1, 0,
            'smoke-thrower', 1700, 'win', 'smoke', 1790, 'checkmated', 'black', 'loss', 'manual', '',
            'lichess')`).run({
            pgn: '1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 4. Qxf7# 1-0',
            moves: JSON.stringify(['e4', 'e5', 'Bc4', 'Nc6', 'Qh5', 'Nf6', 'Qxf7#']),
            fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
          })
          db.prepare(`INSERT INTO game_analysis (game_id, evals, analyzed_at, movetime_ms)
            VALUES ('smoke-thrown', ?, '1970-01-01T00:00:01.000Z', 150)`).run(JSON.stringify([
            e(30, null, 'e2', 'e4', 'e4'), e(30, null, 'e7', 'e5', 'e5'), e(-1000, null, 'g1', 'f3', 'Nf3'),
            e(-1000, null, 'b8', 'c6', 'Nc6'), e(-1000, null, 'g1', 'f3', 'Nf3'), e(-1000, null, 'g7', 'g6', 'g6'),
            e(null, 1, 'h5', 'f7', 'Qxf7#'), e(null, 1),
          ]))
          // A white repertoire line the smoke game follows, for the quiz and its per-line game counts.
          const node = db.prepare(`INSERT INTO repertoire_moves (id, color, parent_id, ply, move_san,
            fen, created_at) VALUES (?, 'white', ?, ?, ?, ?, '1970-01-01T00:00:00.000Z')`)
          node.run('smoke-r1', null, 1, 'e4', 'rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1')
          node.run('smoke-r2', 'smoke-r1', 2, 'e5', 'rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2')
          // A game from a king-and-rook-vs-king position, so that lesson's "your games" line and
          // Today's endgame suggestion have a game; its quiz is done, so the lesson is still pending.
          db.prepare(`INSERT INTO games (id, url, pgn, moves_san, initial_fen, time_control,
            time_class, rules, rated, end_time, white_username, white_result, black_username,
            black_result, my_color, my_result, archive_ym, created_at, site)
            VALUES ('smoke-endgame', '', '', @moves, @fen, '180', 'blitz', 'chess', 0, 0, 'smoke-white',
            'win', 'smoke-endgame-opponent', 'resigned', 'white', 'win', 'manual', '', 'lichess')`).run({
            moves: JSON.stringify(['Ra5+']),
            fen: '8/8/8/4k3/8/8/8/R3K3 w - - 0 1',
          })
          db.prepare(`INSERT INTO lesson_progress (slug, quiz_completed_at)
            VALUES ('king-and-rook-vs-king', '1970-01-01T00:00:00.000Z')`).run()
          JS
          get_routes
          # notFound() still answers 200 (loading.tsx streams), so check each page's content too.
          check() {
            body=$(curl -fsS --max-time 30 "http://127.0.0.1:9878$1") || { echo "::error::$1 failed"; exit 1; }
            grep -qF "$2" <<< "$body" || { echo "::error::$1 lacks \"$2\""; exit 1; }
          }
          check_absent() {
            body=$(curl -fsS --max-time 30 "http://127.0.0.1:9878$1") || { echo "::error::$1 failed"; exit 1; }
            ! grep -qF "$2" <<< "$body" || { echo "::error::$1 shows \"$2\""; exit 1; }
          }
          check /games/smoke smoke-black
          check '/games/smoke/play?ply=2&elo=1600' 'Bot strength'
          check /games/lichess:smoke123 'View on Lichess'
          check '/games/lichess:smoke123/play?ply=2&elo=1600' 'Bot strength'
          # Practice games count nowhere but their own lists.
          check /games/smoke 'Practice games from this one'
          check '/games?practice=1' 'Stockfish 1600'
          check_absent /games 'Stockfish 1600'
          check /games/smoke-practice 'practice vs the bot'
          # Only analysis data puts these there: the worst blunder, the drill card and its trouble
          # card (in the page's RSC payload), and Today's last-game accuracy.
          check /blunders smoke-black
          check /blunders 'By time left'
          check /blunders 'href="/games/smoke-thrown/play?ply=2"'
          # No ?elo=, as the thrown-win link goes: the level comes from the game's rating.
          check '/games/smoke-thrown/play?ply=2' 'value="1800" selected=""'
          check '/repertoire?mode=quiz' 'Line 1 of 1, from memory'
          check /drill smoke-black
          check /drill 'Trouble cards'
          check / '% accuracy'
          check /learn/sicilian-defense 'Sicilian Defense'
          check /learn/king-and-rook-vs-king 'King and Rook vs. King'
          check /learn/king-and-rook-vs-king smoke-endgame-opponent
          check /learn/lucena-position 'Lucena Position'
          check /learn 'Quiz ✓'
          check '/learn?status=pending' 'href="/learn/king-and-rook-vs-king"'
          check / '1 of your games reached these pieces'
          # A puzzle from each bundled Lichess set (the real-game one is in the loop above), and a filter.
          check /puzzles/10001 'Lichess puzzle bjqrC'
          check /puzzles/20002 'Lichess puzzle e1pHA'
          check '/puzzles?kind=defend' 'href="/puzzles/20002"'
          # The engine Worker loads these by a name hardcoded in two places (the setup script and
          # lib/stockfish/client.ts); a mismatch would only show as analysis failing in the browser.
          for f in stockfish-19-lite-single.js stockfish-19-lite-single.wasm; do
            curl -fsS -o /dev/null "http://127.0.0.1:9878/stockfish/$f" || { echo "::error::/stockfish/$f failed"; exit 1; }
          done
          wasm_type=$(curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:9878/stockfish/stockfish-19-lite-single.wasm)
          [ "$wasm_type" = application/wasm ] || { echo "::error::the engine's wasm is served as $wasm_type"; exit 1; }
          # Every curl above uses Host 127.0.0.1, so a proxy.ts or headers() that stopped loading
          # (a Next rename, a refactor) would pass silently.
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:9878/)
          [ "$status" = 403 ] || { echo "::error::a foreign Host got $status, not 403"; exit 1; }
          headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:9878/)
          grep -qi '^x-frame-options: DENY' <<< "$headers" || { echo "::error::no X-Frame-Options"; exit 1; }
          # A page that became static would be prerendered without nonces, and 'strict-dynamic' would
          # block all its scripts while curl still sees a 200: each must carry its response's nonce.
          for route in / /games /openings /learn /settings /repertoire /drill /blunders /puzzles /puzzles/1 /games/smoke; do
            page=$(curl -fsS --max-time 30 -D "$RUNNER_TEMP/headers" "http://127.0.0.1:9878$route")
            nonce=$(grep -i '^content-security-policy:' "$RUNNER_TEMP/headers" | grep -o "'nonce-[^']*'" | sed "s/^'nonce-//; s/'\$//")
            [ -n "$nonce" ] || { echo "::error::$route has no CSP nonce"; exit 1; }
            scripts=$(grep -o '<script[^>]*>' <<< "$page")
            [ -n "$scripts" ] && ! grep -vF "nonce=\"$nonce\"" <<< "$scripts" || { echo "::error::$route has a script without the CSP nonce"; exit 1; }
          done
          # With no username at all, any page is the setup screen and nothing else.
          CHESSCOM_USERNAME= LICHESS_USERNAME= pnpm start -p 9879 >> "$log" 2>&1 &
          setup=$(curl -fsS --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:9879/games)
          grep -q 'LICHESS_USERNAME' <<< "$setup" || { echo "::error::no setup screen without a username"; exit 1; }
          if grep -q 'href="/settings"' <<< "$setup"; then echo "::error::the setup screen shows the sidebar"; exit 1; fi
          # Next logs a server-side render or action error as "⨯ …", even when the page recovers.
          if grep -F '⨯' "$log"; then
            echo "::error::the server logged errors (above)"
            exit 1
          fi

      # Nothing else runs scripts/: they import lib/*.ts through Node's type stripping, which tsc
      # doesn't hold them to (an enum, a parameter property, an import without .ts). The import
      # scripts need the Lichess dump, so just load every lib/ file a script imports.
      - name: Script imports
        run: |
          node --input-type=module -e "
            import { readdirSync, readFileSync } from 'node:fs'
            const files = new Set()
            for (const f of readdirSync('scripts')) {
              for (const [, lib] of readFileSync('scripts/' + f, 'utf8').matchAll(/from '\\.\\.\\/(lib\\/[^']+)'/g)) files.add(lib)
            }
            if (files.size === 0) throw new Error('no lib/ imports found in scripts/')
            for (const lib of files) await import('./' + lib)
            console.log([...files].join('\\n'))
          "

      # The smoke test left a database with its seeded games to back up; the 'smoke' one must be in it.
      - name: Backup script
        run: |
          pnpm backup
          node -e "
            const [file] = require('fs').readdirSync('data/backups').filter((f) => f.startsWith('blitzr-'))
            const db = new (require('better-sqlite3'))('data/backups/' + file, { readonly: true })
            if (!db.prepare(\"SELECT 1 FROM games WHERE id = 'smoke'\").get()) process.exit(1)
          "
